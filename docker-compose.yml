services:
  mongo:
    image: mongo:7.0
    container_name: dristikon_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - dristikon_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dristikon_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - MONGOURI=mongodb://mongo:27017/dristikon_db
    volumes:
      - ./src:/usr/src/app/src
      - /usr/src/app/node_modules
    command: npm run dev
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dristikon_network

volumes:
  mongo_data:
    driver: local

networks:
  dristikon_network:
    driver: bridge
