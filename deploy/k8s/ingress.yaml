apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dristikon-ingress
  namespace: dristikon
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: '16m'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '60'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '60'
spec:
  tls:
    - hosts:
        - api.dristikon.com
        - dristikon.com
      secretName: dristikon-tls-cert
  rules:
    - host: api.dristikon.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dristikon-backend-service
                port:
                  number: 4000
    - host: dristikon.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: dristikon-backend-service
                port:
                  number: 4000
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: dristikon-backend-service
                port:
                  number: 4000
