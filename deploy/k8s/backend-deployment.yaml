apiVersion: apps/v1
kind: Deployment
metadata:
  name: dristikon-backend
  namespace: dristikon
  labels:
    app: dristikon-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dristikon-backend
  template:
    metadata:
      labels:
        app: dristikon-backend
    spec:
      containers:
        - name: backend
          image: dristikon/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: dristikon-backend-config
            - secretRef:
                name: dristikon-backend-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: uploads-storage
              mountPath: /usr/src/app/uploads
      volumes:
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: uploads-data-pvc
